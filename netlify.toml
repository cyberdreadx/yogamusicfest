# Netlify configuration — static site + Stripe checkout function
[build]
  publish = "."
  command = ""

# Serverless functions (Stripe Checkout Session creation lives here)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pretty URLs for the staff check-in scanner and organizer panel
[[redirects]]
  from = "/checkin"
  to = "/checkin.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/promotor"
  to = "/promotor.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# Staff/organizer pages must never be indexed
[[headers]]
  for = "/checkin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/promotor.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
