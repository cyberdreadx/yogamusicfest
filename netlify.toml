# Netlify configuration — static site + Stripe checkout function
[build]
  publish = "."
  command = ""

# Serverless functions (Stripe Checkout Session creation lives here)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
