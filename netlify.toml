# Netlify configuration — static single-page site (no build step)
[build]
  publish = "."
  command = ""

# Long-cache the immutable asset-heavy page; adjust if you deploy often
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
