<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>TYMF · Check-in</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--bg:#0a0d0a;--card:#10160f;--line:rgba(201,164,78,.28);--gold:#e6c884;--gold2:#c9a44e;--text:#efe8d6;--dim:#aeb09a;
        --ok:#2f7d46;--okbg:#123a20;--warn:#8a5a12;--warnbg:#3a2a0e;--bad:#7d2f2f;--badbg:#3a1414}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       min-height:100svh;padding:max(env(safe-area-inset-top),12px) 14px 24px}
  .wrap{max-width:460px;margin:0 auto}
  header{text-align:center;padding:8px 0 14px;position:relative}
  header .m{font-family:Georgia,serif;letter-spacing:5px;font-weight:bold;color:var(--gold);font-size:18px}
  header .s{letter-spacing:3px;font-size:10px;color:var(--dim);text-transform:uppercase;margin-top:3px}
  .lang{position:absolute;top:0;right:0;display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:transparent}
  .lang button{border:0;background:transparent;color:var(--dim);padding:4px 9px;font-size:11px;font-weight:600;margin:0;border-radius:0;width:auto;letter-spacing:0}
  .lang button[data-on]{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1405}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
  label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  input{width:100%;background:#0c120b;border:1px solid var(--line);border-radius:8px;padding:13px 14px;color:var(--text);
        font-size:16px;letter-spacing:2px}
  input:focus{outline:none;border-color:var(--gold)}
  button{width:100%;border:0;border-radius:8px;padding:14px;font-size:14px;font-weight:600;letter-spacing:.1em;
         text-transform:uppercase;cursor:pointer;margin-top:12px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1405}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .hint{font-size:12px;color:var(--dim);margin-top:10px;text-align:center;line-height:1.5}
  #reader{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px}
  #reader video{display:block;width:100%!important}
  .hidden{display:none!important}
  .manual{margin-top:14px}
  .result{border-radius:14px;padding:22px 18px;text-align:center;margin-bottom:14px;border:1px solid}
  .result .big{font-size:30px;font-weight:800;letter-spacing:.02em;margin:0 0 6px}
  .result .nm{font-size:20px;font-weight:600;margin:6px 0 2px}
  .result .meta{font-size:13px;opacity:.9;margin-top:4px}
  .result .code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;font-size:14px;margin-top:10px;opacity:.85}
  .r-ok{background:var(--okbg);border-color:#3aa15e;color:#c8f2d5}
  .r-used{background:var(--warnbg);border-color:#c99a3a;color:#f0d9a6}
  .r-bad{background:var(--badbg);border-color:#c95a5a;color:#f2c8c8}
  .count{text-align:center;font-size:12px;color:var(--dim);margin-top:14px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .topbar a{font-size:12px;color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="m">T Y M F</div>
    <div class="s" data-t="subtitle">Check-in · 2026</div>
    <div class="lang" id="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" aria-pressed="false">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  </header>

  <!-- PIN gate -->
  <section id="pinScreen" class="card">
    <label for="pin" data-t="accessPin">PIN de acceso</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" />
    <button id="pinBtn" data-t="enter">Entrar</button>
    <p id="pinErr" class="hint" style="color:#f2c8c8"></p>
    <p class="hint" data-t="staffOnly">Solo para personal. Pide el PIN a la organización.</p>
  </section>

  <!-- Scanner -->
  <section id="scanScreen" class="hidden">
    <div class="topbar">
      <span class="hint" style="margin:0" data-t="cameraHint">Apunta la cámara al código QR</span>
      <a href="#" id="logout" data-t="logout">Salir</a>
    </div>
    <div id="result" class="hidden"></div>
    <div id="reader"></div>
    <div id="scanControls">
      <button id="rescanBtn" class="hidden" data-t="scanNext">Escanear siguiente</button>
    </div>
    <div class="manual card" style="margin-top:14px">
      <label for="manual" data-t="manualLabel">O ingresa el código manualmente</label>
      <input id="manual" autocapitalize="characters" placeholder="TYMF-XXXXXXXX" />
      <button id="manualBtn" class="ghost" data-t="verifyCode">Verificar código</button>
    </div>
    <div id="count" class="count"></div>
  </section>
</div>

<script>
(function(){
  var PIN='', scanner=null, scanning=false, checked=0;
  var $=function(id){return document.getElementById(id);};
  var TXT={
    es:{
      subtitle:'Check-in · 2026', accessPin:'PIN de acceso', enter:'Entrar', staffOnly:'Solo para personal. Pide el PIN a la organización.',
      cameraHint:'Apunta la cámara al código QR', logout:'Salir', scanNext:'Escanear siguiente', manualLabel:'O ingresa el código manualmente', verifyCode:'Verificar código',
      enterPin:'Ingresa el PIN', cameraUnavailable:'Cámara no disponible en este navegador. Usa el código manual abajo.', cameraOpenError:function(err){ return 'No se pudo abrir la cámara ('+err+'). Usa el código manual abajo.'; },
      verifying:'Verificando…', badPin:'PIN incorrecto', valid:'✓ VÁLIDO', admits:function(qty){ return 'Admite '+qty+(qty>1?' personas':' persona'); },
      alreadyUsed:'⚠ YA REGISTRADO', checkedAt:function(when){ return 'Registrado a las '+when; }, notFound:'✗ NO ENCONTRADO', codeMissing:'Este código no existe',
      error:'✗ ERROR', offline:'Sin conexión', sessionCount:function(n){ return 'Registrados en esta sesión: '+n; }, languageToggle:'Cambiar idioma'
    },
    en:{
      subtitle:'Check-in · 2026', accessPin:'Access PIN', enter:'Enter', staffOnly:'Staff only. Ask the organizers for the PIN.',
      cameraHint:'Point the camera at the QR code', logout:'Log out', scanNext:'Scan next', manualLabel:'Or enter the code manually', verifyCode:'Verify code',
      enterPin:'Enter the PIN', cameraUnavailable:'Camera is not available in this browser. Use the manual code field below.', cameraOpenError:function(err){ return 'Could not open the camera ('+err+'). Use the manual code field below.'; },
      verifying:'Checking…', badPin:'Incorrect PIN', valid:'✓ VALID', admits:function(qty){ return 'Admits '+qty+(qty>1?' people':' person'); },
      alreadyUsed:'⚠ ALREADY CHECKED IN', checkedAt:function(when){ return 'Checked in at '+when; }, notFound:'✗ NOT FOUND', codeMissing:'This code does not exist',
      error:'✗ ERROR', offline:'Offline', sessionCount:function(n){ return 'Checked in this session: '+n; }, languageToggle:'Switch language'
    }
  };
  var EVENT_LOCALE='es-MX', EVENT_TIME_ZONE='America/Cancun';
  var lastResult=null, L; try{L=localStorage.getItem('tymf_lang')||'es';}catch(e){L='es';}
  function t(k){var d=TXT[L]||TXT.en; return (k in d)?d[k]:(TXT.en[k]!=null?TXT.en[k]:k);}
  function applyStatic(){
    document.documentElement.lang=L;
    document.querySelectorAll('[data-t]').forEach(function(el){ var v=t(el.getAttribute('data-t')); if(typeof v==='string') el.textContent=v; });
    document.querySelectorAll('[data-lang]').forEach(function(s){
      var active=s.getAttribute('data-lang')===L;
      s.setAttribute('aria-label',s.getAttribute('data-lang')==='es'?'Español':'English');
      s.setAttribute('aria-pressed',active?'true':'false');
      if(active) s.setAttribute('data-on','1');
      else s.removeAttribute('data-on');
    });
    updateCount();
    if(lastResult) showResultState();
  }

  // restore PIN
  try{ PIN=sessionStorage.getItem('tymf_pin')||''; }catch(e){}
  document.querySelectorAll('#lang [data-lang]').forEach(function(btn){ btn.onclick=function(){ var next=btn.getAttribute('data-lang'); if(next===L) return; L=next; try{localStorage.setItem('tymf_lang',L);}catch(e){} applyStatic(); }; });
  applyStatic();
  if(PIN){ showScan(); }

  $('pinBtn').onclick=function(){
    PIN=$('pin').value.trim();
    if(!PIN){ $('pinErr').textContent=t('enterPin'); return; }
    try{ sessionStorage.setItem('tymf_pin',PIN); }catch(e){}
    $('pinErr').textContent='';
    showScan();
  };
  $('pin').addEventListener('keydown',function(e){ if(e.key==='Enter') $('pinBtn').click(); });

  $('logout').onclick=function(e){ e.preventDefault(); try{sessionStorage.removeItem('tymf_pin');}catch(_){}
    stopScanner(); $('scanScreen').classList.add('hidden'); $('pinScreen').classList.remove('hidden'); $('pin').value=''; };

  $('manualBtn').onclick=function(){ var v=$('manual').value.trim(); if(v){ validate(v); } };
  $('manual').addEventListener('keydown',function(e){ if(e.key==='Enter') $('manualBtn').click(); });
  $('rescanBtn').onclick=function(){ hideResult(); startScanner(); };

  function showScan(){
    $('pinScreen').classList.add('hidden');
    $('scanScreen').classList.remove('hidden');
    startScanner();
  }

  function startScanner(){
    if(typeof Html5Qrcode==='undefined'){
      $('reader').innerHTML='<p class="hint">'+escapeHtml(t('cameraUnavailable'))+'</p>';
      return;
    }
    if(scanning) return;
    if(!scanner) scanner=new Html5Qrcode('reader');
    scanning=true;
    $('rescanBtn').classList.add('hidden');
    scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},
      function(decoded){ if(scanning){ scanning=false; scanner.stop().then(function(){ validate(decoded); }).catch(function(){ validate(decoded); }); } },
      function(){}
    ).catch(function(err){
      scanning=false;
      $('reader').innerHTML='<p class="hint">'+escapeHtml(t('cameraOpenError')(err&&err.message||err))+'</p>';
    });
  }
  function stopScanner(){ if(scanner&&scanning){ scanning=false; scanner.stop().catch(function(){}); } }

  function validate(text){
    lastResult={kind:'verifying'};
    showResultState();
    fetch('/.netlify/functions/checkin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin:PIN,code:text})})
      .then(function(r){ return r.json().then(function(d){ return {s:r.status,d:d}; }); })
      .then(function(res){
        var st=res.s, d=res.d;
        if(st===401){ alert(t('badPin')); try{sessionStorage.removeItem('tymf_pin');}catch(_){}
          location.reload(); return; }
        if(d.status==='ok'){
          checked++;
          lastResult={kind:'ok',code:d.code,order:d.order||{}};
        } else if(d.status==='used'){
          lastResult={kind:'used',code:d.code,order:d.order||{}};
        } else if(d.status==='invalid'){
          lastResult={kind:'invalid',code:d.code||''};
        } else {
          lastResult={kind:'error',message:d.message||''};
        }
        showResultState();
        finishScan();
      })
      .catch(function(){ lastResult={kind:'error',message:t('offline')}; showResultState(); finishScan(); });
  }

  function showResult(cls,big,nm,meta,code){
    var el=$('result');
    el.className='result '+cls;
    el.innerHTML='<div class="big">'+big+'</div>'+
      (nm?'<div class="nm">'+escapeHtml(nm)+'</div>':'')+
      (meta?'<div class="meta">'+escapeHtml(meta)+'</div>':'')+
      (code?'<div class="code">'+escapeHtml(code)+'</div>':'');
    el.classList.remove('hidden');
  }
  function showResultState(){
    if(!lastResult) return;
    if(lastResult.kind==='verifying'){ showResult('r-used',t('verifying'),'','',''); return; }
    if(lastResult.kind==='ok'){
      var o=lastResult.order||{};
      showResult('r-ok',t('valid'), o.name||'—', t('admits')(o.qty||1), lastResult.code||'');
      return;
    }
    if(lastResult.kind==='used'){
      var o2=lastResult.order||{}, when=o2.usedAt?new Date(o2.usedAt).toLocaleTimeString(EVENT_LOCALE,{timeZone:EVENT_TIME_ZONE}):'';
      showResult('r-used',t('alreadyUsed'), o2.name||'—', when?t('checkedAt')(when):'', lastResult.code||'');
      return;
    }
    if(lastResult.kind==='invalid'){ showResult('r-bad',t('notFound'),'',
      t('codeMissing'), lastResult.code||''); return; }
    showResult('r-bad',t('error'),'',
      lastResult.message||'', '');
  }
  function hideResult(){ $('result').classList.add('hidden'); }
  function finishScan(){
    $('rescanBtn').classList.remove('hidden');
    updateCount();
    $('manual').value='';
    if(navigator.vibrate){ navigator.vibrate(120); }
  }
  function updateCount(){ $('count').textContent = checked>0 ? t('sessionCount')(checked) : ''; }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
})();
</script>
</body>
</html>
