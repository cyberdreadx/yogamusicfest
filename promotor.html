<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>TYMF · Promoter Panel</title>
<style>
  :root{--bg:#0a0d0a;--card:#10160f;--line:rgba(201,164,78,.26);--gold:#e6c884;--gold2:#c9a44e;--text:#efe8d6;--dim:#a7a992;--good:#7fbf90}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       min-height:100svh;padding:max(env(safe-area-inset-top),16px) 16px 40px}
  .wrap{max-width:440px;margin:0 auto}
  header{text-align:center;padding:10px 0 18px;position:relative}
  header .m{font-family:Georgia,serif;letter-spacing:6px;font-weight:bold;color:var(--gold);font-size:20px}
  header .s{letter-spacing:3px;font-size:10px;color:var(--dim);text-transform:uppercase;margin-top:4px}
  .lang{position:absolute;top:6px;right:0;display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;cursor:pointer}
  .lang span{padding:4px 9px;font-size:11px;font-weight:600;color:var(--dim)}
  .lang span[data-on]{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1405}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
  .hi{font-family:Georgia,serif;font-size:22px;color:var(--text);margin:0 0 2px}
  .hi b{color:var(--gold)}
  .muted{color:var(--dim);font-size:13px}
  .big{text-align:center;padding:8px 0}
  .big .n{font-family:Georgia,serif;font-size:52px;color:var(--gold);line-height:1}
  .big .l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .box{background:#0c120b;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
  .box .n{font-family:Georgia,serif;font-size:22px;color:var(--text)}
  .box .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:4px}
  .note{font-size:12px;color:var(--dim);line-height:1.6;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .note a{color:var(--gold)}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .lk{font-family:ui-monospace,monospace;font-size:13px;color:var(--gold);background:#0c120b;border:1px dashed var(--line);border-radius:8px;padding:11px 12px;word-break:break-all}
  button{border:0;border-radius:8px;padding:11px 15px;font-size:13px;font-weight:600;cursor:pointer;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1a1405;margin-top:10px;width:100%}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;border:1px solid var(--line);color:var(--dim)}
  .pill.good{color:var(--good);border-color:rgba(127,191,144,.5)}
  .center{text-align:center}
  .hidden{display:none!important}
  .msg{text-align:center;color:var(--dim);padding:30px 10px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="m">T Y M F</div><div class="s" data-t="subtitle">Panel de Promotor</div>
    <button class="lang" id="lang" aria-label="Idioma / Language"><span data-lang="es">ES</span><span data-lang="en">EN</span></button>
  </header>

  <div id="loading" class="msg" data-t="loading">Cargando…</div>
  <div id="error" class="msg hidden"></div>

  <div id="content" class="hidden">
    <div class="card">
      <div class="hi"><span data-t="hi">Hola</span>, <b id="pcode">—</b></div>
      <div class="muted" data-t="thanks">Gracias por difundir Tulum Yoga Music Fest 🪷</div>
      <div class="big"><div class="n" id="tickets">0</div><div class="l" data-t="ticketsSold">Boletos vendidos</div></div>
      <div class="grid">
        <div class="box"><div class="n" id="earned">$0</div><div class="l" data-t="earnedTotal">Ganado (total)</div></div>
        <div class="box"><div class="n" id="rate">$100</div><div class="l" data-t="perTicket">Por boleto</div></div>
      </div>
      <div id="payNote" class="note"></div>
    </div>

    <div class="card">
      <label data-t="yourLink">Tu enlace para compartir</label>
      <div class="lk" id="shareLink">—</div>
      <button class="ghost" id="copyBtn" data-t="copy">Copiar enlace</button>
      <p class="muted center" style="margin:12px 0 0" data-t="linkNote">Cada boleto que se compre con tu enlace suma $100 MXN a tu cuenta.</p>
    </div>

    <div class="center"><button class="ghost" id="refresh" style="width:auto;padding:9px 18px" data-t="refresh">Actualizar</button></div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var TXT={
    es:{subtitle:'Panel de Promotor',loading:'Cargando…',invalid:'Enlace inválido. Pide a la organización tu enlace de promotor.',loadFail:'No se pudo cargar tu panel.',connErr:'Error de conexión. Intenta de nuevo.',
        hi:'Hola',thanks:'Gracias por difundir Tulum Yoga Music Fest 🪷',ticketsSold:'Boletos vendidos',earnedTotal:'Ganado (total)',perTicket:'Por boleto',
        yourLink:'Tu enlace para compartir',copy:'Copiar enlace',copied:'¡Copiado!',copyManual:'Copia manual',linkNote:'Cada boleto que se compre con tu enlace suma $100 MXN a tu cuenta.',refresh:'Actualizar',
        autoActive:'Pago automático activo',autoNote:function(a){return 'Tus comisiones ('+a+') se depositan automáticamente a tu banco vía Stripe. Consulta tus pagos en ';},
        owedNote:function(a){return 'Comisión por pagar: <b>'+a+'</b> — ';},paidBy:'te la paga la organización directamente',paid:'Pagado',wantAuto:'La organización gestiona los pagos por separado mediante Stripe Global Payouts. Contacta al equipo para coordinar tu pago.'},
    en:{subtitle:'Promoter Panel',loading:'Loading…',invalid:'Invalid link. Ask the organizers for your promoter link.',loadFail:'Could not load your panel.',connErr:'Connection error. Try again.',
        hi:'Hi',thanks:'Thanks for spreading the word about Tulum Yoga Music Fest 🪷',ticketsSold:'Tickets sold',earnedTotal:'Earned (total)',perTicket:'Per ticket',
        yourLink:'Your link to share',copy:'Copy link',copied:'Copied!',copyManual:'Copy manually',linkNote:'Every ticket bought with your link adds $100 MXN to your account.',refresh:'Refresh',
        autoActive:'Auto-payout active',autoNote:function(a){return 'Your commissions ('+a+') are deposited automatically to your bank via Stripe. See your payouts at ';},
        owedNote:function(a){return 'Commission pending: <b>'+a+'</b> — ';},paidBy:'the organizers pay you directly',paid:'Paid',wantAuto:'The organizers handle payments separately through Stripe Global Payouts. Contact the team to arrange your payout.'}
  };
  var L; try{L=localStorage.getItem('tymf_lang')||'es';}catch(e){L='es';}
  function t(k){var d=TXT[L]||TXT.en; return (k in d)?d[k]:(TXT.en[k]!=null?TXT.en[k]:k);}
  function applyStatic(){ document.documentElement.lang=L;
    document.querySelectorAll('[data-t]').forEach(function(el){var v=t(el.getAttribute('data-t')); if(typeof v==='string')el.textContent=v;});
    document.querySelectorAll('[data-lang]').forEach(function(s){ if(s.getAttribute('data-lang')===L)s.setAttribute('data-on','1'); else s.removeAttribute('data-on'); }); }
  $('lang').onclick=function(){ L=(L==='es'?'en':'es'); try{localStorage.setItem('tymf_lang',L);}catch(e){} applyStatic(); if(last)render(last); };
  applyStatic();

  var qs=new URLSearchParams(location.search);
  var code=(qs.get('p')||'').toLowerCase(), token=qs.get('k')||'';
  var link=location.origin+'/?ref='+code, last=null;

  if(!code||!token){ fail(t('invalid')); return; }
  load();
  $('refresh').onclick=load;
  $('copyBtn').onclick=function(){ (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject())
    .then(function(){ $('copyBtn').textContent=t('copied'); }).catch(function(){ $('copyBtn').textContent=t('copyManual'); }); };

  function fail(m){ $('loading').classList.add('hidden'); var e=$('error'); e.textContent=m; e.classList.remove('hidden'); }
  function mxn(n){ return '$'+((n||0)).toLocaleString('en-US')+' MXN'; }

  function load(){
    fetch('/.netlify/functions/promoter-stats',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:code,token:token})})
      .then(function(r){ return r.json().then(function(d){return{s:r.status,d:d};}); })
      .then(function(res){ if(res.s!==200){ fail(res.d&&res.d.error?res.d.error:t('loadFail')); return; } last=res.d; render(res.d); })
      .catch(function(){ fail(t('connErr')); });
  }
  function render(d){
    $('loading').classList.add('hidden'); $('error').classList.add('hidden'); $('content').classList.remove('hidden');
    $('pcode').textContent=d.code;
    $('tickets').textContent=d.tickets||0;
    $('earned').textContent=mxn(d.commission);
    $('shareLink').textContent=link;
    var note='';
    note=t('owedNote')(mxn(d.commissionOwed))+(d.paidManual?'<span class="pill good">'+t('paid')+'</span>':t('paidBy'))+'.'+
         '<br><span class="muted">'+t('wantAuto')+'</span>';
    if(d.commissionAuto) note+='<br>'+(L==='es'?'Transferido anteriormente: ':'Previously transferred: ')+mxn(d.commissionAuto);
    $('payNote').innerHTML=note;
  }
})();
</script>
</body>
</html>
